name: hangout
description: "A new Flutter project."
publish_to: 'none'
# RELEASE GATE (venue hours + gallery, spec F8): don't cut a store build from
# main while VenueHoursEditorPage / VenueGalleryManagerPage are stubs — the
# Manage hub tiles and the gallery's «إدارة الصور» already open them. Remove
# this note when both UI slices have merged.
version: 1.0.0+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  fl_chart: ^1.1.1
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_tabler_icons: ^1.43.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  responsive_framework: ^1.5.1
  smooth_page_indicator: ^2.0.1
  cached_network_image: ^3.4.1
  animate_gradient: ^0.0.4
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  expandable_text: ^2.3.0
  intl: ^0.20.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  share_plus: ^10.1.4
  social_share: ^2.3.1
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  flutter_map_animations: ^0.9.0
  zo_animated_border: ^1.0.6
  flutter_dotenv: ^6.0.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  vector_math: ^2.2.0
  dotted_border: ^3.1.0
  carousel_slider: ^5.1.2
  dismissible_page: ^1.0.2
  flutter_animation_progress_bar: ^2.3.1
  story_view: ^0.16.6

  retrofit: ^4.9.0
  logger: ^2.6.0  # for logging purpose
  json_annotation: ^4.9.0
  dio: ^5.9.2
  fresh_dio: ^0.6.0
  flutter_secure_storage: ^10.0.0
  pinput: ^6.0.2
  cached_network_image_plus: ^0.0.5
  mime: ^2.0.0
  file_picker: ^10.3.10
  flutter_debouncer: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  slide_switcher: ^1.1.2
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  mention_tag_text_field: ^0.0.9
  photo_manager: ^3.0.0
  video_thumbnail: ^0.5.6
  flutter_keyboard_visibility: ^6.0.0
  shimmer_animation: ^2.2.2+1
  infinite_scroll_pagination: ^5.1.1
  hexcolor: ^3.1.3
  audioplayers: ^6.6.0
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.2.4
  jwt_decoder: ^2.0.1
  animated_toggle_switch: ^0.8.7
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0
  google_sign_in: ^7.2.0
  image: ^4.3.0
  image_cropper: ^9.1.0
  pinch_zoom: ^2.0.1
  flutter_map_marker_cluster: ^8.2.2
  stomp_dart_client: ^3.0.1
  record: ^6.2.0
  just_audio: ^0.10.5
  sqflite: ^2.4.2+1
  flutter_moving_background: ^0.0.6
  shake: ^3.0.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.5
  wave_divider: ^0.0.3
  perforated_border: ^1.0.3
  showcaseview: ^5.1.0
  geocoding: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#000000"
  image_dark: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
    image_dark: assets/images/splash_logo.png
    color_dark: "#000000"

  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/translations/
    - assets/font/
    - assets/images/
    - assets/audio/
    - assets/3d/
    - assets/map.png
    - assets/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/font/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/font/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/font/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/font/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/font/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/font/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/font/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  size: 50
  icon_size: 50
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"